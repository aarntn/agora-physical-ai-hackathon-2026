name: Starter checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify competition workspace
        run: |
          test -f README.md
          test -f .env.example
          for doc in RULES RUBRIC RESEARCH COMPETITORS PRODUCT_DECISION ARCHITECTURE AGORA_INTEGRATION HARDWARE TEST_RESULTS DEMO SUBMISSION WORKFLOW; do
            test -s "docs/$doc.md"
          done
          for dir in firmware agora backend web tests fixtures; do
            test -s "$dir/README.md"
          done
          git diff --check HEAD
      - name: Reject tracked local environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "Tracked environment file found"
            exit 1
          fi
